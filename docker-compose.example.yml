services:
  divoom:
    build: .
    image: divoom-client:local
    ports:
      - "8080:8080"
    environment:
      DIVOOM_LAYOUT: config/layouts/dashboard.json
      DIVOOM_PORT: "8080"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - ./config:/app/config
    restart: unless-stopped

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divoom-client"
version = "0.1.0"
description = "Studio UI, layout editor, and live data dashboard for Divoom Pixoo 64 displays"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jason Person", email = "jsperson@gmail.com" }
]
keywords = [
    "divoom",
    "pixoo",
    "pixoo64",
    "led-matrix",
    "dashboard",
    "raspberry-pi",
    "macos",
    "windows",
    "linux",
    "home-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "apscheduler>=3.10.0",
    "yfinance>=0.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "jsonpath-ng>=1.6.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx>=0.27.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/jsperson/divoom_client"
Repository = "https://github.com/jsperson/divoom_client"
Issues = "https://github.com/jsperson/divoom_client/issues"

[project.scripts]
divoom = "divoom_client.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/divoom_client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
